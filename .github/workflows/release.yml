name: Release module

# Publish a GitHub release with a tag like v1.0.1 and this workflow builds module.zip,
# stamps the version and URLs into module.json, and attaches both to the release.
# Foundry and The Forge then see the update through the manifest URL.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and URLs into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Zip the module
        run: zip -r module.zip module.json scripts templates styles README.md CHANGELOG.md

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber

